project_id = "lead-emergence-entry"

[api]
enabled = true
port = 55421
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 55422
shadow_port = 55420
major_version = 17

[db.pooler]
enabled = false

[db.migrations]
enabled = true

[db.seed]
enabled = false

[realtime]
enabled = true

[studio]
enabled = true
port = 55423

[inbucket]
enabled = true
port = 55424
smtp_port = 55425
pop3_port = 55426

[storage]
enabled = true

[analytics]
enabled = false

[auth]
enabled = true
site_url = "http://127.0.0.1:3300"
additional_redirect_urls = [
  "http://127.0.0.1:3300/auth/callback",
  "http://localhost:3300/auth/callback",
  "http://127.0.0.1:3300/auth/callback?next=%2Fupdate-password",
  "http://localhost:3300/auth/callback?next=%2Fupdate-password",
]
enable_signup = true
enable_refresh_token_rotation = true

[auth.email.template.invite]
subject = "Set up your Lead Emergence account"
content_path = "./supabase/templates/invite.html"

[auth.oauth_server]
enabled = true
authorization_url_path = "/oauth/consent"
allow_dynamic_registration = false
